[package]
name = "keeper-oracle-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Typed Reflector Pulse client for Keeper Network conditions"
authors = ["Soroban Keeper Network Contributors"]
repository = "https://github.com/soroban-tooling/soroban-keeper-network"
keywords = ["soroban", "stellar", "oracle", "reflector", "price-feed"]
categories = ["cryptography::cryptocurrencies"]
# examples/usage.rs is illustrative documentation, not a compiled example.
autoexamples = false

# `[lib] name` must use underscores: Cargo rejects hyphens in library target
# names. Callers import this crate as `oracle_client::*`.
[lib]
# rlib so other contracts can `use keeper_oracle_client::*` as a normal library dependency
name = "oracle_client"
# rlib so other contracts can `use oracle_client::*` as a normal library dependency
crate-type = ["rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "22.0.1" }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(fuzzing)"] }

[dev-dependencies]
soroban-sdk = { version = "22.0.1", features = ["testutils"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(fuzzing)"] }

# Note: release profile is defined once at the workspace root Cargo.toml.
# Profiles in non-root packages are ignored by Cargo, so it is not repeated here.
