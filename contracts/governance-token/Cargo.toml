[package]
name = "governance-token"
version = "0.1.0"
edition = "2021"
authors = ["Soroban Keeper Network Contributors"]
description = "Governance token ($KPRS) contract for the Soroban Keeper Network"
license = "Apache-2.0"
repository = "https://github.com/soroban-tooling/soroban-keeper-network"
description = "KPRS governance token contract for Soroban/Stellar"
license = "Apache-2.0"
repository = "https://github.com/soroban-tooling/soroban-keeper-network"
keywords = ["soroban", "stellar", "governance", "kprs", "token"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(fuzzing)"] }
soroban-sdk = { version = "22.0.1" }

[dev-dependencies]
soroban-sdk = { version = "22.0.1", features = ["testutils"] }
