[package]
name = "keeper-governance"
version = "0.1.0"
edition = "2021"
authors = ["Soroban Keeper Network Contributors"]
description = "Governance contract for the Soroban Keeper Network"
license = "Apache-2.0"
repository = "https://github.com/soroban-tooling/soroban-keeper-network"
keywords = ["soroban", "stellar", "keeper", "governance", "dao"]
categories = ["cryptography::cryptocurrencies"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "22.0.1" }
governance-token = { path = "../governance-token" }

[dev-dependencies]
soroban-sdk = { version = "22.0.1", features = ["testutils"] }
keeper-registry = { path = "../keeper-registry", features = ["testutils"] }
proptest = { version = "1", default-features = false, features = ["std", "alloc"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(fuzzing)"] }
