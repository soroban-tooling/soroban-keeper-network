[package]
name = "treasury"
version = "0.1.0"
edition = "2021"
authors = ["Soroban Keeper Network Contributors"]
description = "Recipient distribution treasury contract for the Soroban Keeper Network"
license = "Apache-2.0"
repository = "https://github.com/soroban-tooling/soroban-keeper-network"
keywords = ["soroban", "stellar", "treasury", "automation", "defi"]
categories = ["cryptography::cryptocurrencies"]

[lib]
# cdylib for the on-chain WASM build; rlib so the property tests (and any
# other Rust-side consumer) can `use treasury::*` as a normal library
# dependency instead of only linking the compiled WASM.
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "22.0.1" }

[dev-dependencies]
soroban-sdk = { version = "22.0.1", features = ["testutils"] }
proptest = "1"

# `cfg(fuzzing)` is set automatically by cargo-fuzz/libfuzzer-sys, not
# declared anywhere in this workspace's own Cargo.toml — the check-cfg lint
# introduced in recent rustc otherwise (harmlessly) warns that it doesn't
# recognize the name.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(fuzzing)"] }

# Note: release profile is defined once at the workspace root Cargo.toml.
# Profiles in non-root packages are ignored by Cargo, so it is not repeated here.
