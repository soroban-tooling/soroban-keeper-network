name: External Link Check

# External (http/https) links in Markdown are checked on a schedule rather than
# on every PR. Third-party sites time out, rate-limit and redesign on their own
# schedule, so a per-PR check would fail contributors for problems they did not
# cause. Relative links and anchors, which a PR can break, are checked on every
# PR by the `markdown-links` job in pr-hygiene.yml.
#
# Run it by hand from the Actions tab (workflow_dispatch) or locally:
#   python3 scripts/check-md-links.py --external

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-external
  cancel-in-progress: true

jobs:
  external-links:
    name: Markdown links (external)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check external links
        run: python3 scripts/check-md-links.py --external --timeout 20 --workers 8
