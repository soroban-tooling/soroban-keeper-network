name: Testnet Smoke

# Nightly read-only check of the testnet deployment recorded in DEPLOYMENTS.md.
# Catches an expired TTL, a reset network, or a drained test account.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: testnet-smoke
  cancel-in-progress: false

env:
  # One tracking issue is reused across nights instead of opening a new one.
  ISSUE_LABEL: testnet-smoke
  ISSUE_TITLE: "Testnet smoke test failing"

jobs:
  smoke:
    name: Read-only views on testnet registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read testnet contract ID from DEPLOYMENTS.md
        id: deployment
        run: |
          id="$(grep -oE 'C[A-Z2-7]{55}' DEPLOYMENTS.md | head -n 1)"
          if [ -z "$id" ]; then
            echo "::error::No testnet contract ID found in DEPLOYMENTS.md"
            exit 1
          fi
          echo "contract_id=$id" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install stellar CLI
        run: cargo install --locked stellar-cli

      # View calls are simulated only (--send=no), so nothing is submitted on
      # chain. The source account needs to exist on testnet for simulation.
      - name: Call read-only views
        id: views
        env:
          CONTRACT_ID: ${{ steps.deployment.outputs.contract_id }}
          SMOKE_SOURCE_SECRET: ${{ secrets.TESTNET_SMOKE_SECRET_KEY }}
          REPORT: ${{ runner.temp }}/smoke-report.md
        run: |
          : > "$REPORT"
          for fn in version is_paused task_count; do
            if out="$(stellar contract invoke --id "$CONTRACT_ID" --network testnet \
                --source-account "$SMOKE_SOURCE_SECRET" --send=no -- "$fn" 2>&1)"; then
              echo "PASS $fn -> $out"
            else
              echo "FAIL $fn"
              {
                echo "- \`$fn\` failed:"
                echo '  ```'
                echo "$out" | tail -n 5
                echo '  ```'
              } >> "$REPORT"
            fi
          done

          if [ -s "$REPORT" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the tracking issue
        if: steps.views.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/smoke-report.md
          CONTRACT_ID: ${{ steps.deployment.outputs.contract_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "$ISSUE_LABEL" --color D93F0B \
            --description "Nightly testnet smoke test failures" --force

          body="$(printf 'The nightly smoke test failed against `%s`.\n\nRun: %s\n\n%s\n' \
            "$CONTRACT_ID" "$RUN_URL" "$(cat "$REPORT")")"

          number="$(gh issue list --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number // empty')"

          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
          fi

      - name: Fail the job if any view failed
        if: steps.views.outputs.failed == 'true'
        run: exit 1
