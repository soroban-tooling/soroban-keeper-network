# Template rendered by the Prometheus container entrypoint. The placeholders
# are replaced from PROM_INDEXER_TARGET, PROM_KEEPER_TARGET and
# PROM_CANARY_TARGET, with defaults supplied by docker-compose.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: indexer
    static_configs:
      - targets: ["__INDEXER_TARGET__"]

  - job_name: keeper-bot-v2
    static_configs:
      - targets: ["__KEEPER_TARGET__"]

  - job_name: canary
    static_configs:
      - targets: ["__CANARY_TARGET__"]
