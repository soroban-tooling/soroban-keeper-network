[package]
name = "recurring-subscription-contract"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Soroban recurring payment / subscription contract with keeper task execution"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "22.0.1" }

[dev-dependencies]
soroban-sdk = { version = "22.0.1", features = ["testutils"] }
