[package]
name = "limit-order-contract"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Soroban limit order contract with on-chain price-threshold condition gating and swap slippage protection"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "22.0.1" }

[dev-dependencies]
soroban-sdk = { version = "22.0.1", features = ["testutils"] }
